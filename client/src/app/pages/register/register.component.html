<section class="form-page">
  <div class="panel">
    <h1>User Registration</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Full Name <input formControlName="fullName" placeholder="John Smith"></label>
      <label>Email <input formControlName="email" placeholder="john@example.com"></label>
      <label>Mobile <input formControlName="mobile" placeholder="01712345678"></label>
      <label>User Name <input formControlName="userName" placeholder="johnsmith"></label>
      <label>Password <input type="password" formControlName="password" placeholder="Password@123"></label>
      <label>Confirm Password <input type="password" formControlName="confirmPassword" placeholder="Password@123"></label>

      <p class="success" *ngIf="message">{{ message }}</p>
      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Register' }}</button>
    </form>
  </div>
</section>
