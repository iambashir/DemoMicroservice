<section class="form-page">
  <div class="panel">
    <h1>Change Password</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>User Name <input formControlName="userName"></label>
      <label>Old Password <input type="password" formControlName="oldPassword"></label>
      <label>New Password <input type="password" formControlName="newPassword" placeholder="NewPassword@123"></label>
      <label>Confirm Password <input type="password" formControlName="confirmPassword" placeholder="NewPassword@123"></label>

      <p class="success" *ngIf="message">{{ message }}</p>
      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" [disabled]="loading">{{ loading ? 'Updating...' : 'Change Password' }}</button>
    </form>
  </div>
</section>
