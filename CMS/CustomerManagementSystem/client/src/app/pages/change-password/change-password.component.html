<section class="panel form-panel">
  <h1 class="form-title">Change Password</h1>
  <p class="form-subtitle">Update your password using the active JWT session.</p>
  <div class="alert success" *ngIf="successMessage">{{ successMessage }}</div>
  <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field"><label>Username</label><input formControlName="userName" /><span class="error" *ngIf="form.get('userName')?.touched && form.get('userName')?.hasError('required')">Username is required.</span></div>
    <div class="field"><label>Old Password</label><input type="password" formControlName="oldPassword" /><span class="error" *ngIf="form.get('oldPassword')?.touched && form.get('oldPassword')?.hasError('required')">Old password is required.</span></div>
    <div class="field"><label>New Password</label><input type="password" formControlName="newPassword" /><span class="error" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid">New password must be at least 8 characters.</span></div>
    <div class="field"><label>Confirm Password</label><input type="password" formControlName="confirmPassword" /><span class="error" *ngIf="form.touched && form.hasError('passwordMismatch')">Passwords must match.</span></div>
    <button class="btn" type="submit" [disabled]="loading"><span class="spinner" *ngIf="loading"></span>Change Password</button>
  </form>
</section>
